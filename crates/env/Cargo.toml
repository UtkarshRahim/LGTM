[package]
name = "prism-env"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "process"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
