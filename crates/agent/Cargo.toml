[package]
name = "prism-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-env = { version = "0.1.0", path = "../env" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "macros", "rt", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
