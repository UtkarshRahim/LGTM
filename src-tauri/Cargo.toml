[package]
name = "prism"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Dock and menu bar show the executable's name in dev builds.
[[bin]]
name = "LGTM"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
prism-gh.workspace = true
prism-repo.workspace = true
prism-skills.workspace = true
prism-agent.workspace = true
prism-store.workspace = true
prism-env.workspace = true
prism-syntax.workspace = true
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
specta-typescript = "0.0.15"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
